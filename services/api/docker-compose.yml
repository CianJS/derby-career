services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: derby
      POSTGRES_PASSWORD: derby_local
      POSTGRES_DB: derby_career
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - derby_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U derby -d derby_career"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  derby_pg:
