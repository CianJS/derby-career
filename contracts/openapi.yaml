openapi: 3.0.3
info:
  title: DERBY CAREER Backend Foundation
  version: 0.1.0
  description: 독립 Fastify/PostgreSQL 서버. public 이벤트/기준 카탈로그 API와 소유자 인증으로 보호된 Career API.
    AUTH_MODE=disabled가 기본이며 Career API는 503으로 닫힘. 로컬 dev-session 또는 명시적으로 설정한
    운영 oidc-jwt 인증을 사용한다. 외부 로그인 서비스·공식 후보 생성·유료 등록비 연동은 후속 협의.
    계약 변경 시 이 파일과 생성 타입을 함께 갱신.
servers:
- url: http://127.0.0.1:4000
  description: Local independent API server
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: getLiveness
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Liveness'
        '400':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /health/ready:
    get:
      operationId: getReadiness
      summary: getReadiness
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
