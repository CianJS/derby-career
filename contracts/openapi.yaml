    CountryCode:
      type: string
      pattern: '^[A-Z]{3}$'
      description: ISO alpha-3. Gameplay supports KOR/JPN/USA. Unknown legacy codes (including GBR) are preserved and never coerced.
    Expedition:
      type: object
      additionalProperties: false
      required: [id, careerId, targetCountry, targetRaceDefinitionId, status, startedRevision, startedTurn, endedTurn, endReason, createdAt, endedAt]
      properties:
        id: {type: string, format: uuid}
        careerId: {type: string, format: uuid}
        targetCountry:
          $ref: '#/components/schemas/CountryCode'
        targetRaceDefinitionId: {type: string, nullable: true}
        status: {type: string, enum: [active, returned]}
        startedRevision: {type: integer, minimum: 1}
        startedTurn: {type: integer, minimum: 1}
        endedTurn: {type: integer, minimum: 1, nullable: true}
        endReason: {type: string, enum: [return, retirement], nullable: true}
        createdAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time, nullable: true}
    StableTravel:
      type: object
      additionalProperties: false
      required: [homeCountry, locationCountry, revision, activeExpedition]
      properties:
        homeCountry:
          $ref: '#/components/schemas/CountryCode'
        locationCountry:
          $ref: '#/components/schemas/CountryCode'
        revision: {type: integer, minimum: 0}
        activeExpedition:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Expedition'
    ExpeditionResponse:
      type: object
      additionalProperties: false
      required: [travel]
      properties:
        travel:
          $ref: '#/components/schemas/StableTravel'
    StartExpedition:
      type: object
      additionalProperties: false
      required: [commandId, targetCountry, expectedTravelRevision]
      properties:
        commandId: {type: string, format: uuid}
        targetCountry: {type: string, enum: [KOR, JPN, USA]}
        expectedTravelRevision: {type: integer, minimum: 0}
        raceDefinitionId: {type: string, minLength: 1, maxLength: 100}
    ReturnExpedition:
      type: object
      additionalProperties: false
      required: [commandId, expectedTravelRevision]
      properties:
        commandId: {type: string, format: uuid}
        expectedTravelRevision: {type: integer, minimum: 0}
