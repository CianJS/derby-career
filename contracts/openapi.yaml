components:
  securitySchemes:
    CareerBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT or opaque development session
      description: oidc-jwt는 설정한 HTTPS JWKS로 RS256/ES256 서명, issuer, API 전용 audience, token type,
        sub, iat, exp와 최대 나이를 검증한다. 검증된 issuer와 sub만 소유자에 매핑한다.
        미설정은 503, 유효하지 않은 토큰은 401, 공개키 서비스 장애는 503이다. dev-session은 CLI 발급,
        해시 저장, 만료/폐기 검사를 사용하며 로컬에서만 허용한다. 로그인·토큰 발급 HTTP endpoint는 없다.
  responses:
    Unauthorized:
      description: 유효한 소유자 인증이 필요함
      headers:
        WWW-Authenticate:
          description: Bearer 인증을 요구하는 HTTP challenge
          schema:
            type: string
            enum:
            - Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ApiError:
      description: 검증 실패, 권한 거부, 충돌 또는 외부 의존성 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: &id004
              type: string
            message: *id004
            requestId: *id004
          required:
          - code
          - message
          - requestId
          additionalProperties: false
      required:
      - error
      additionalProperties: false
    Values:
      type: object
      properties:
        speed:
          type: number
          minimum: 0
          maximum: 1000
        stamina:
          type: number
          minimum: 0
          maximum: 1000
        power:
          type: number
          minimum: 0
          maximum: 1000
        guts:
          type: number
          minimum: 0
          maximum: 1000
        intelligence:
          type: number
          minimum: 0
          maximum: 1000
        fatigue:
          type: number
          minimum: 0
        bodyLoad:
          type: number
          minimum: 0
      required:
      - speed
      - stamina
      - power
      - guts
      - intelligence
      - fatigue
      - bodyLoad
      additionalProperties: false
    Stats:
      type: object
      properties:
        speed:
          type: number
          minimum: 0
          maximum: 1000
        stamina:
          type: number
          minimum: 0
          maximum: 1000
        power:
          type: number
          minimum: 0
          maximum: 1000
        guts:
          type: number
          minimum: 0
          maximum: 1000
        intelligence:
          type: number
          minimum: 0
          maximum: 1000
      required:
      - speed
      - stamina
      - power
      - guts
      - intelligence
      additionalProperties: false
    Aptitudes:
      type: array
      items:
        type: array
        items: *id004
        minItems: 2
        maxItems: 2
    HorseDefinition:
      type: object
      properties:
        id: *id004
        name: *id004
        growth: *id004
        description: *id004
        stats:
          $ref: '#/components/schemas/Stats'
        aptitude:
          $ref: '#/components/schemas/Aptitudes'
      required:
      - id
      - name
      - growth
      - description
      - stats
      - aptitude
      additionalProperties: false
    ConditionAlways:
      type: object
      properties:
        type:
          type: string
          enum:
          - always
      required:
      - type
      additionalProperties: false
    ConditionHealthy:
      type: object
      properties:
        type:
          type: string
          enum:
          - healthy
      required:
      - type
      additionalProperties: false
    ConditionTrainingAvailable:
      type: object
      properties:
        type:
          type: string
          enum:
          - training_available
