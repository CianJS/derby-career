      description: 동일 actionId/본문 재전송은 원래 응답을 반환. ID 재사용 시 본문이 다르면 409. 동일 월 다른 actionId도
        409. 서버가 공유 도메인 함수로 계산하며 client state/result/seed는 받지 않음.
