        '429':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      security:
      - CareerBearer: []
      parameters:
      - name: careerId
        in: path
        required: true
