        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /v1/events:
    get:
      operationId: listEvents
      summary: listEvents
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      parameters:
      - &id001
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
      - &id002
        name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - common
          - normal
          - special
          - accident
          - hidden
      - name: enabled
        in: query
        required: false
        schema: &id008
          type: boolean
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ready
          - needs_mapping
          - deferred
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - id
          - name
          default: id
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      description: 실제 Notion 이벤트 카탈로그. page/pageSize 방식, id 또는 name(C collation +
        id) 안정 정렬. needs_mapping/deferred는 실행되지 않음. 초기 보상은 balanceVersion에 기록된 제안치.
