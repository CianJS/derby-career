      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCareer'
      description: 개발용 카탈로그에서 새로운 서버 Career 생성. careerId는 재시도에 유지해야 하는 UUID. 기존 브라우저
        저장의 이전/삭제 없음.
