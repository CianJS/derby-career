  /v1/events:
    get:
      operationId: listEvents
      summary: listEvents
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      parameters:
      - &id001
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100000
          default: 1
      - &id002
        name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - common
          - normal
          - special
          - accident
          - hidden
      - name: enabled
        in: query
        required: false
        schema: &id008
          type: boolean
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ready
          - needs_mapping
          - deferred
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - id
          - name
          default: id
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      description: 공개 가능한 활성·ready·검토 완료 비히든 정의만 반환한다. query는 공개 범위를 좁히는
        필터이며 enabled=false, 미검토 상태, hidden 요청은 빈 목록을 반환한다. total도 공개 범위 기준이다.
        page/pageSize 방식, id 또는 name(C collation + id) 안정 정렬. 기존 공통 활성315개는 유지한다.
  /v1/events/{eventId}:
    get:
      operationId: getEvent
      summary: getEvent
      description: 공개 목록과 같은 접근 정책을 적용한다. 비활성·미검토·히든 정의와 없는 ID는 동일한404를
        반환한다. 히든이 실제 발생한 소유 Career의 이벤트는 인증된 Career/이력 API에서만 조회한다.
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDefinition'
        '400':
          $ref: '#/components/responses/ApiError'
        '413':
          $ref: '#/components/responses/ApiError'
        '415':
          $ref: '#/components/responses/ApiError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/ApiError'
        '429':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 100
