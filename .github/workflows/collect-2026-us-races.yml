name: Collect 2026 US Graded Stakes data

on:
  push:
    branches: [data/collect-us-graded-stakes-2026]
    paths:
      - 'scripts/data-import/harvest-toba-2026.py'
      - '.github/workflows/collect-2026-us-races.yml'

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scraper dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Collect complete official TOBA table and validate
        run: python scripts/data-import/harvest-toba-2026.py
      - name: Commit the reproducible source snapshot to this data-only branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/2026-us-graded-listed-races.json
          if ! git diff --cached --quiet; then
            git commit -m "data: snapshot official 2026 US Graded and Listed stakes"
            git push
          fi
